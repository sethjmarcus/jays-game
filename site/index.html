<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100-Square Jump Puzzle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>100-Square Jump Puzzle</h1>
  <p class="sub">Fill the board with 1, 2, 3… Each next number is a jump of 3 squares up, down, left or right, or 2 squares diagonally.</p>

  <div class="layout">
    <div>
      <div class="panel">
        <h2>Search</h2>
        <label class="row">Board size
          <select id="size"></select></label>
        <label class="row">Solutions to find
          <input id="count" type="number" min="1" max="100000" value="20"></label>
        <label class="row">Time limit (s)
          <input id="seconds" type="number" min="1" max="600" value="20"></label>
        <label class="row">Start square (optional)
          <input id="start" type="text" placeholder="e.g. A1" maxlength="3" autocomplete="off" spellcheck="false"></label>
        <label class="row">Closed loops only
          <input id="loops" type="checkbox"></label>
        <ul class="errors" id="errors" role="alert" hidden></ul>
        <button id="go" class="primary">Find solutions</button>
        <button id="stop" class="primary danger" hidden>Stop</button>
        <div class="status" id="status"></div>
      </div>

      <div class="panel">
        <h2>Display</h2>
        <label class="row">Show path lines <input id="showLines" type="checkbox" checked></label>
        <label class="row">Show numbers <input id="showNums" type="checkbox" checked></label>
        <label class="row">Colour by step <input id="gradient" type="checkbox" checked></label>
        <label class="row">Direction arrows <input id="showArrows" type="checkbox" checked></label>
        <button id="animate" class="wide">▶ Animate path</button>
      </div>
    </div>

    <div class="panel">
      <div class="nav">
        <button id="prev" disabled>◀</button>
        <div class="info" id="info">No solutions yet</div>
        <button id="next" disabled>▶</button>
      </div>
      <div id="boardWrap"><div class="empty">Press <b>Find solutions</b> to start.</div></div>
      <div class="slider" id="sliderRow" hidden>
        <span>Step</span>
        <input id="step" type="range" min="1" max="100" value="100">
        <span id="stepLabel" class="step-label"></span>
      </div>
      <div class="legend" id="legend" hidden>
        <i class="dot-start"></i>first square
        <i class="dot-end"></i>last square
      </div>
    </div>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
